name: AI Redteam Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  redteam:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn requests

    - name: Start FastAPI server
      run: |
        nohup uvicorn 01-ai-red-teaming-lab.app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
        sleep 5

    - name: Run reteam probes
      run: |
        python 01-ai-red-teaming-lab/app/redteam.py

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: redteam-results
        path: 01-ai-red-teaming-lab/results/
